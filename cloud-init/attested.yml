#cloud-config
hostname: ${HOSTNAME}
users:
  - default
  - name: ${USERNAME}
    groups: [canarybit]
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    shell: /bin/bash
    ssh_authorized_keys:
      - ${SSH_PUBKEY}

timezone: UTC

package_update: true
package_upgrade: true
package_reboot_if_required: false
packages:
  - jq

runcmd:
  - |
    if [ "${OS_NAME}" = "rhel" ]; then
      dnf --disablerepo='*debug*' --disablerepo='*source*' -y install tpm2-tss
    elif [ "${OS_NAME}" = "ubuntu" ]; then
      DEBIAN_FRONTEND=noninteractive apt-get install -y libtss2-dev
    else
      echo "Unsupported OS: ${OS_NAME}" >&2
      exit 1
    fi

write_files:
  # Custom policy for the current cVM instance (optional)
  - path: /etc/canarybit/custom-policy.rego
    defer: true
    permissions: '0600'
    content: |
      ${CUSTOM_POLICY}

  # Configure cb-inspector-client as a System service
  - path: /etc/systemd/system/cb-inspector-client.service
    defer: true
    permissions: '0600'
    content: |
      [Unit]
      Description=CanaryBit Remote Attestation
      
      [Service]
      EnvironmentFile=/etc/canarybit/tokens
      Environment="CB_INSPECTOR_CLIENT_LOG_LEVEL=info"
      Environment="CB_INSPECTOR_CLIENT_ENVIRONMENTS=${ENVIRONMENTS}"
      Environment="CB_INSPECTOR_CLIENT_INSPECTOR_URL=${CB_INSPECTOR_URL}"
      Environment="CB_INSPECTOR_CLIENT_ANNOTATIONS=${CB_INSPECTOR_CLIENT_ANNOTATIONS}"
      Type=oneshot
      ExecStart=/bin/bash -c '/usr/local/bin/cb-inspector-client --token $(/usr/local/bin/cb login inspector) --key /etc/canarybit/signing-key.pem ${CUSTOM_POLICY_OPT}'

  # Set a frequency for cb-inspector-client.service
  - path: /etc/systemd/system/cb-inspector-client.timer
    defer: true
    permissions: '0600'
    content: |
      [Unit]
      Description=CanaryBit Remote Attestation Timer
      
      [Timer]
      OnCalendar=${FREQUENCY}
      Persistent=true
      
      [Install]
      WantedBy=timers.target

  # Initialize the cb-inspector-client systemd service
  - path: /etc/canarybit/launch-cb-inspector-client
    defer: true
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      if [[ -f /home/${USERNAME}/tokens ]]; then
        install -D -o root -g root -m 0600 /home/${USERNAME}/tokens /etc/canarybit/tokens
        rm -f /home/${USERNAME}/tokens
      elif [[ ! -f /etc/canarybit/tokens ]]; then
        echo "Neither staged nor protected token file exists" >&2
        exit 1
      fi
      if [[ -f /home/${USERNAME}/signing-key.pem ]]; then
        install -D -o root -g root -m 0600 /home/${USERNAME}/signing-key.pem /etc/canarybit/signing-key.pem
        rm -f /home/${USERNAME}/signing-key.pem
      elif [[ ! -f /etc/canarybit/signing-key.pem ]]; then
        echo "Neither staged nor protected signing key exists" >&2
        exit 1
      fi
      if command -v restorecon >/dev/null 2>&1; then
        restorecon -F /etc/canarybit/tokens /etc/canarybit/signing-key.pem
      fi

      set -a
      source /etc/canarybit/tokens
      set +a

      curl -fsSL https://canarybit-public-binaries.s3.eu-west-1.amazonaws.com/cb-cli/${CBCLI_V}/cb-x86_64-unknown-linux-gnu -o /usr/local/bin/cb
      chmod 0755 /usr/local/bin/cb
      /usr/local/bin/cb download cb-inspector-client ${CB_INSPECTOR_CLIENT_V}/cb-inspector-client
      chmod 0755 ${CB_INSPECTOR_CLIENT_V}/cb-inspector-client
      mv ${CB_INSPECTOR_CLIENT_V}/cb-inspector-client /usr/local/bin/cb-inspector-client

      systemctl daemon-reload
      systemctl start cb-inspector-client.service
      systemctl enable --now cb-inspector-client.timer

final_message: |
  ==========   CANARYBIT TOWER SETUP COMPLETED IN $UPTIME secs    ==========
  The security and privacy of this environment is verified by CanaryBit Remote Attestation service:
  ${CB_INSPECTOR_URL}
